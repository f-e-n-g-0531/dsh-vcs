name: Browser layout checks
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CHROME_BIN: google-chrome
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require a version tag, never a same-named branch
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$REF_TYPE" = tag
          node scripts/verify-tag.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install only fixture dependencies, no lifecycle builds
        run: npm ci --include=dev --ignore-scripts
      - name: Consume exact CI candidate, never rebuild plugin
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&per_page=100" > ci-evidence/ci.json
          node scripts/release-preflight.mjs select-ci ci-evidence
          ci_run="$(node -p "require('./ci-evidence/ci-selection.json').ci.id")"
          ci_attempt="$(node -p "require('./ci-evidence/ci-selection.json').ci.attempt")"
          for matrix in ubuntu-latest-node-22 ubuntu-latest-node-24 windows-latest-node-22 windows-latest-node-24; do
            gh run download "$ci_run" --name "dsh-vcs-$matrix-attempt-$ci_attempt" --dir "ci-evidence/candidates/$matrix"
          done
          node scripts/release-preflight.mjs consume ci-evidence
      - run: node --test test/layout-report.test.mjs
      - run: node scripts/layout-fixture.mjs
      - name: Run runner Chrome against isolated fixture
        shell: bash
        run: |
          set -euo pipefail
          "$CHROME_BIN" --version
          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --window-size=1920,1080 --virtual-time-budget=10000 --dump-dom "file://$PWD/test-results/layout-fixture.html#autorun" > test-results/layout-dom.html
          node scripts/verify-layout-result.mjs
      - name: Check synthetic keyboard events in Chrome
        shell: bash
        run: |
          set -euo pipefail
          node --test test/review-keyboard.test.mjs
          node scripts/keyboard-fixture.mjs
          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --dump-dom "file://$PWD/test-results/keyboard-fixture.html" > test-results/keyboard-dom.html
          node scripts/verify-keyboard-result.mjs
      - name: Exercise real React history components
        shell: bash
        run: |
          set -euo pipefail
          node scripts/history-fixture.mjs
          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom "file://$PWD/test-results/history-fixture.html" > test-results/history-dom.html
          node scripts/verify-history-result.mjs
      - name: Install SVN for isolated local repository evidence
        run: sudo apt-get update && sudo apt-get install -y subversion apache2 libapache2-mod-svn
      - name: Fail fast on browser fixture tools
        run: node scripts/test-preflight.mjs --browser > test-results/browser-tools.json
      - name: Capture isolated Apache SVN discovery wire
        run: node scripts/svn-dav-fixture.mjs
      - name: Exercise actual Monaco modules and concurrent editors
        shell: bash
        run: |
          set -euo pipefail
          node scripts/monaco-fixture.mjs
          timeout 240s node scripts/run-monaco-browser.mjs
          node scripts/verify-monaco-result.mjs
      - name: Record exact tag Chrome success
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node scripts/release-preflight.mjs chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-layout-evidence-attempt-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
