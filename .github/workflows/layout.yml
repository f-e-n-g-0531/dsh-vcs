name: Browser layout checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/layout-report.test.mjs
      - run: node scripts/layout-fixture.mjs
      - name: Run runner Chrome against isolated fixture
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version
          google-chrome --headless --no-sandbox --disable-gpu --window-size=1920,1080 --virtual-time-budget=10000 --dump-dom "file://$PWD/test-results/layout-fixture.html#autorun" > test-results/layout-dom.html
          node scripts/verify-layout-result.mjs
      - name: Check synthetic keyboard events in Chrome
        shell: bash
        run: |
          set -euo pipefail
          node --test test/review-keyboard.test.mjs
          node scripts/keyboard-fixture.mjs
          google-chrome --headless --no-sandbox --disable-gpu --dump-dom "file://$PWD/test-results/keyboard-fixture.html" > test-results/keyboard-dom.html
          node scripts/verify-keyboard-result.mjs
      - name: Exercise real React history components
        shell: bash
        run: |
          set -euo pipefail
          npm ci --include=dev --ignore-scripts
          node scripts/history-fixture.mjs
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom "file://$PWD/test-results/history-fixture.html" > test-results/history-dom.html
          node scripts/verify-history-result.mjs
      - name: Install SVN for isolated local repository evidence
        run: sudo apt-get update && sudo apt-get install -y subversion apache2 libapache2-mod-svn
      - name: Capture isolated Apache SVN discovery wire
        run: node scripts/svn-dav-fixture.mjs
      - name: Exercise actual Monaco modules and concurrent editors
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node scripts/monaco-fixture.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 > test-results/monaco-server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/test-results/monaco-fixture.html -o /dev/null && break || sleep 0.2; done
          timeout 60s node scripts/run-monaco-browser.mjs
          node scripts/verify-monaco-result.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-layout-evidence
          path: test-results/
          retention-days: 14
