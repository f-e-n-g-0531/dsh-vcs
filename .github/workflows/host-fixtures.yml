name: Prepare controlled offline host fixtures
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    # Explicitly authorized online preparation; downstream contracts remain offline.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host: ['0.1.7-rc.2', '0.2.0-rc.2', '0.2.1-rc.2', '0.2.1-rc.5']
    steps:
      - name: Allow only protected default branch manual preparation
        env:
          CURRENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$CURRENT_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare exact official host and lock registry integrity
        env:
          HOST_VERSION: ${{ matrix.host }}
        run: |
          set -euo pipefail
          host_root="$RUNNER_TEMP/official-host-$HOST_VERSION"
          node scripts/prepare-host-fixture.mjs init "$host_root" "$HOST_VERSION"
          npm install --prefix "$host_root" --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org/ --no-audit --no-fund
          node scripts/prepare-host-fixture.mjs validate "$host_root" "$HOST_VERSION"
          npm ci --prefix "$host_root" --ignore-scripts --registry=https://registry.npmjs.org/ --no-audit --no-fund
          output="$RUNNER_TEMP/host-artifact-$HOST_VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          node scripts/release-host-fixture.mjs pack "$host_root" "$HOST_VERSION" "$output"
          node scripts/prepare-host-fixture.mjs attest "$host_root" "$HOST_VERSION" "$output"
      - uses: actions/upload-artifact@v4
        with:
          name: host-fixture-${{ matrix.host }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-artifact-${{ matrix.host }}-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
