name: Draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z); must match package.version
        required: true
        type: string

permissions: {}

concurrency:
  group: draft-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate requested tag
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'Tag must have the form vX.Y.Z (no prerelease or leading zeroes).' >&2
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import assert from "node:assert/strict"; const pkg = JSON.parse(readFileSync("package.json", "utf8")); assert.equal(process.env.RELEASE_TAG, "v" + pkg.version, "Tag and package.version differ");'

      - name: Install Subversion test tools
        run: sudo apt-get update && sudo apt-get install -y subversion

      - run: npm ci
      - run: npm run check
      - name: Verify package contents and installation
        run: |
          set -euo pipefail
          node scripts/verify-package.mjs
          npm run test:install

      - name: Pack checked artifact and calculate SHA-256
        id: pack
        run: |
          set -euo pipefail
          # check already ran; do not execute a second set of lifecycle scripts.
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/dsh-vcs-pack.json"
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const reports = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/dsh-vcs-pack.json', 'utf8'));
          assert.equal(reports.length, 1);
          const filename = reports[0].filename;
          assert.match(filename, /^[a-zA-Z0-9][a-zA-Z0-9._-]*\.tgz$/);
          appendFileSync(process.env.GITHUB_OUTPUT, 'filename=' + filename + '\n');
          NODE
          artifact="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/dsh-vcs-pack.json", "utf8"))[0].filename)')"
          sha256sum -- "$artifact" > SHA256SUMS.txt
          sha256sum --check -- SHA256SUMS.txt

      - name: Create draft GitHub release (never publish)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT: ${{ steps.pack.outputs.filename }}
        run: |
          set -euo pipefail
          # --verify-tag forbids creating a tag. Existing releases cause failure;
          # this workflow never overwrites assets or publishes an existing draft.
          gh release create "$RELEASE_TAG" "$ARTIFACT" SHA256SUMS.txt \
            --verify-tag --draft --title "$RELEASE_TAG" \
            --notes 'Read-only DSH VCS plugin. Review the tarball and SHA-256 checksum before manually publishing this draft. No npm publication is performed.'
