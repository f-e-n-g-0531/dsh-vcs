name: Publish GitHub and npm
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z); must match package.version
        required: true
        type: string
      channel:
        description: Explicit publication channel (github-only never contacts npm)
        required: true
        type: choice
        default: both
        options: [both, github-only]
permissions: {}
concurrency:
  group: draft-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate requested tag and channel
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_CHANNEL" = both || "$RELEASE_CHANNEL" = github-only ]]
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify tag matches package version
        run: node scripts/verify-tag.mjs
      - name: Select latest successful exact tag SHA and run attempts
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          export RELEASE_SHA="$(git rev-parse HEAD)"
          mkdir -p evidence
          for workflow in ci layout host-compat; do
            case "$workflow" in ci) kind=ci;; layout) kind=chrome;; host-compat) kind=compat;; esac
            gh api "repos/$GH_REPO/actions/workflows/$workflow.yml/runs?head_sha=$RELEASE_SHA&per_page=100" > "evidence/$kind.json"
          done
          node scripts/release-preflight.mjs select evidence
      - name: Download four matrix candidates Chrome and exact host evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_RUN: ${{ steps.runs.outputs.ci_run }}
          CI_ATTEMPT: ${{ steps.runs.outputs.ci_attempt }}
          CHROME_RUN: ${{ steps.runs.outputs.chrome_run }}
          CHROME_ATTEMPT: ${{ steps.runs.outputs.chrome_attempt }}
          COMPAT_RUN: ${{ steps.runs.outputs.compat_run }}
          COMPAT_ATTEMPT: ${{ steps.runs.outputs.compat_attempt }}
        run: |
          set -euo pipefail
          for matrix in ubuntu-latest-node-22 ubuntu-latest-node-24 windows-latest-node-22 windows-latest-node-24; do
            gh run download "$CI_RUN" --name "dsh-vcs-$matrix-attempt-$CI_ATTEMPT" --dir "evidence/candidates/$matrix"
          done
          gh run download "$CHROME_RUN" --name "isolated-layout-evidence-attempt-$CHROME_ATTEMPT" --dir evidence/chrome
          for host in 0.1.7-rc.2 0.2.0-rc.2 0.2.1-rc.2 0.2.1-rc.5; do
            gh run download "$COMPAT_RUN" --name "host-compat-$host-attempt-$COMPAT_ATTEMPT" --dir "evidence/compat/$host"
          done
      - name: Verify evidence and select already-tested candidate bytes
        id: evidence
        run: |
          set -euo pipefail
          export RELEASE_SHA="$(git rev-parse HEAD)"
          node scripts/release-preflight.mjs verify evidence
          (cd verified && sha256sum --check SHA256SUMS.txt)
      # No npm install, npm pack, registry lookup or npm credentials on github-only.
      - name: Configure npm credentials for explicit both channel only
        if: inputs.channel == 'both'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Publish exact tarball to npm
        if: inputs.channel == 'both'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTOMATION_TOKEN }}
          ARTIFACT: ${{ steps.evidence.outputs.filename }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN" || { echo 'Missing NPM_AUTOMATION_TOKEN secret' >&2; exit 1; }
          # Only this step gets npm credentials; never execute package scripts with them.
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {spawnSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          const pkg=JSON.parse(readFileSync('package.json','utf8'));
          assert.equal(pkg.name,'@feng0531/dsh-vcs');
          const integrity='sha512-'+createHash('sha512').update(readFileSync(process.env.ARTIFACT)).digest('base64');
          const url='https://registry.npmjs.org/'+encodeURIComponent(pkg.name)+'/'+pkg.version;
          const response=await fetch(url);
          if(response.ok){
            assert.equal((await response.json()).dist.integrity,integrity,'Existing npm version differs; refuse overwrite');
            console.log('Exact artifact already published; continuing GitHub release');
          }else{
            assert.equal(response.status,404,'Registry lookup failed; refusing publish');
            const result=spawnSync('npm',['publish',process.env.ARTIFACT,'--ignore-scripts','--access','public','--registry=https://registry.npmjs.org/'],{stdio:'inherit'});
            if(result.error)throw result.error;
            assert.equal(result.status,0,'npm publication failed');
          }
          NODE

      - name: Verify public npm artifact before GitHub release
        if: inputs.channel == 'both'
        timeout-minutes: 6
        env:
          ARTIFACT: ${{ steps.evidence.outputs.filename }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          const pkg=JSON.parse(readFileSync('package.json','utf8'));
          const bytes=readFileSync(process.env.ARTIFACT);
          const hash=data=>createHash('sha512').update(data).digest('base64');
          let verified=false;
          for(let attempt=0;attempt<10;attempt++){
            const url='https://registry.npmjs.org/'+encodeURIComponent(pkg.name)+'/'+pkg.version+'?verify='+Date.now();
            const response=await fetch(url,{signal:AbortSignal.timeout(10000),headers:{'Cache-Control':'no-cache'}});
            if(response.ok){
              const metadata=await response.json();
              assert.equal(metadata.dist.integrity,'sha512-'+hash(bytes),'Public npm integrity mismatch');
              const tarball=new URL(metadata.dist.tarball);
              assert.equal(tarball.origin,'https://registry.npmjs.org');
              const archive=await fetch(tarball,{signal:AbortSignal.timeout(15000),redirect:'error'});
              if(archive.ok){
                const body=Buffer.from(await archive.arrayBuffer());
                assert.equal(body.length,bytes.length,'Public npm size mismatch');
                assert.equal(hash(body),hash(bytes),'Public npm bytes mismatch');
                verified=true;break;
              }
              assert.equal(archive.status,404,'Public npm tarball lookup failed');
            }else assert.equal(response.status,404,'Public npm metadata lookup failed');
            if(attempt<9)await new Promise(resolve=>setTimeout(resolve,20000));
          }
          assert.ok(verified,'npm accepted upload but public artifact is not verified; do not create GitHub release or blindly republish');
          NODE

      - name: Publish GitHub release after channel gates succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT: ${{ steps.evidence.outputs.filename }}
        run: |
          set -euo pipefail
          # Existing releases are never overwritten. npm retries require identical integrity.
          notes="docs/releases/${RELEASE_TAG#v}.md"
          test -s "$notes" || { echo "Missing version-specific release notes" >&2; exit 1; }
          gh release create "$RELEASE_TAG" "$ARTIFACT" verified/SHA256SUMS.txt verified/release-evidence.json \
            --verify-tag --title "DSH VCS $RELEASE_TAG" --notes-file "$notes"
