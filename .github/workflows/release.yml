name: Publish GitHub and npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z); must match package.version
        required: true
        type: string

permissions: {}

concurrency:
  group: draft-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate requested tag
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'Tag must have the form vX.Y.Z (no prerelease or leading zeroes).' >&2
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import assert from "node:assert/strict"; const pkg = JSON.parse(readFileSync("package.json", "utf8")); assert.equal(process.env.RELEASE_TAG, "v" + pkg.version, "Tag and package.version differ");'

      - name: Require successful tag CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          export RELEASE_SHA="$(git rev-parse HEAD)"
          gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&event=push&per_page=100" > "$RUNNER_TEMP/tag-ci.json"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const runs=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/tag-ci.json','utf8')).workflow_runs;
          const matching=runs.filter(r=>r.head_sha===process.env.RELEASE_SHA && r.head_branch===process.env.RELEASE_TAG).sort((a,b)=>b.id-a.id);
          assert.ok(matching.length, 'Push the version tag and run CI before preparing a release');
          assert.equal(matching[0].conclusion,'success','Latest CI for this exact tag must succeed');
          NODE

      - name: Install Subversion test tools
        run: sudo apt-get update && sudo apt-get install -y subversion

      - run: npm ci
      - run: npm run check
      - name: Verify package contents and installation
        run: |
          set -euo pipefail
          node scripts/verify-package.mjs
          npm run test:install

      - name: Pack checked artifact and calculate SHA-256
        id: pack
        run: |
          set -euo pipefail
          # check already ran; do not execute a second set of lifecycle scripts.
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/dsh-vcs-pack.json"
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const {parsePackReport} = await import('./scripts/pack-report.mjs');
          const reports = parsePackReport(readFileSync(process.env.RUNNER_TEMP + '/dsh-vcs-pack.json', 'utf8'));
          assert.equal(reports.length, 1);
          const filename = reports[0].filename;
          assert.match(filename, /^[a-zA-Z0-9][a-zA-Z0-9._-]*\.tgz$/);
          appendFileSync(process.env.GITHUB_OUTPUT, 'filename=' + filename + '\n');
          NODE
          artifact="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; import {parsePackReport} from "./scripts/pack-report.mjs"; console.log(parsePackReport(readFileSync(process.env.RUNNER_TEMP + "/dsh-vcs-pack.json", "utf8"))[0].filename)')"
          sha256sum -- "$artifact" > SHA256SUMS.txt
          sha256sum --check -- SHA256SUMS.txt

      - name: Publish exact tarball to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTOMATION_TOKEN }}
          ARTIFACT: ${{ steps.pack.outputs.filename }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN" || { echo 'Missing NPM_AUTOMATION_TOKEN secret' >&2; exit 1; }
          # Only this step gets npm credentials; never execute package scripts with them.
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {spawnSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          const pkg=JSON.parse(readFileSync('package.json','utf8'));
          assert.equal(pkg.name,'@feng0531/dsh-vcs');
          const integrity='sha512-'+createHash('sha512').update(readFileSync(process.env.ARTIFACT)).digest('base64');
          const url='https://registry.npmjs.org/'+encodeURIComponent(pkg.name)+'/'+pkg.version;
          const response=await fetch(url);
          if(response.ok){
            assert.equal((await response.json()).dist.integrity,integrity,'Existing npm version differs; refuse overwrite');
            console.log('Exact artifact already published; continuing GitHub release');
          }else{
            assert.equal(response.status,404,'Registry lookup failed; refusing publish');
            const result=spawnSync('npm',['publish',process.env.ARTIFACT,'--ignore-scripts','--access','public','--registry=https://registry.npmjs.org/'],{stdio:'inherit'});
            if(result.error)throw result.error;
            assert.equal(result.status,0,'npm publication failed');
          }
          NODE

      - name: Verify public npm artifact before GitHub release
        timeout-minutes: 6
        env:
          ARTIFACT: ${{ steps.pack.outputs.filename }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          const pkg=JSON.parse(readFileSync('package.json','utf8'));
          const bytes=readFileSync(process.env.ARTIFACT);
          const hash=data=>createHash('sha512').update(data).digest('base64');
          let verified=false;
          for(let attempt=0;attempt<10;attempt++){
            const url='https://registry.npmjs.org/'+encodeURIComponent(pkg.name)+'/'+pkg.version+'?verify='+Date.now();
            const response=await fetch(url,{signal:AbortSignal.timeout(10000),headers:{'Cache-Control':'no-cache'}});
            if(response.ok){
              const metadata=await response.json();
              assert.equal(metadata.dist.integrity,'sha512-'+hash(bytes),'Public npm integrity mismatch');
              const tarball=new URL(metadata.dist.tarball);
              assert.equal(tarball.origin,'https://registry.npmjs.org');
              const archive=await fetch(tarball,{signal:AbortSignal.timeout(15000),redirect:'error'});
              if(archive.ok){
                const body=Buffer.from(await archive.arrayBuffer());
                assert.equal(body.length,bytes.length,'Public npm size mismatch');
                assert.equal(hash(body),hash(bytes),'Public npm bytes mismatch');
                verified=true;break;
              }
              assert.equal(archive.status,404,'Public npm tarball lookup failed');
            }else assert.equal(response.status,404,'Public npm metadata lookup failed');
            if(attempt<9)await new Promise(resolve=>setTimeout(resolve,20000));
          }
          assert.ok(verified,'npm accepted upload but public artifact is not verified; do not create GitHub release or blindly republish');
          NODE

      - name: Publish GitHub release after npm succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT: ${{ steps.pack.outputs.filename }}
        run: |
          set -euo pipefail
          # Existing releases are never overwritten. npm retries require identical integrity.
          gh release create "$RELEASE_TAG" "$ARTIFACT" SHA256SUMS.txt \
            --verify-tag --title "DSH VCS $RELEASE_TAG" --generate-notes \
            --notes 'IMPORTANT: Released under explicit user authorization, including standing authorization for subsequent DSH VCS releases, before real DSH GUI acceptance. Actual loaded-build and M1-M4 GUI validation remain pending; isolated browser tests are not live GUI acceptance. Read-only Git/SVN plugin for DSH Web 0.1.7-rc.2 or 0.2.0-rc.2. SVN history is not enabled. npm: @feng0531/dsh-vcs. Publication does not install or upgrade the running host and does not restart DSH. Installation requires separate authorization; see the tagged installation guide. Noncommercial use only; see LICENSE. Windows ANSI SVN builds may not support Chinese path arguments; CI uses a UTF-8-configured temporary SVN. The npm package and attached tgz are the same artifact. See docs/INSTALL.md and docs/COMPATIBILITY.md in the tagged source.'
