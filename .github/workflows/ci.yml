name: CI
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y subversion
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install sliksvn -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\Program Files\SlikSvn\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: git --version
      - run: svn --version --quiet
      - run: svnadmin --version --quiet
      - run: npm ci
      - run: npm run check
      - run: npm run verify:package
      - run: npm run test:install
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-vcs-${{ matrix.os }}-node-${{ matrix.node }}
          path: "*.tgz"
